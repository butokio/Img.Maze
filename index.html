<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Img.Maze</title>
        <link href="stylesheets/mystyles.css" rel="stylesheet" type="text/css"/>
        <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    </head>

    <!-- LANDING PAGE: z-index cluster.
         A dense pile with no menu and no focal point. Every picture is used once.
         Two of them are doors: the Reaper Leviathan goes to Water, the Krayt dragon goes to Desert.
         Hover any piece and it jumps to the front. The pieces are in order, back to front. -->
    <body id="landing">
        <main id="pile">

            <!-- BACKING PAPER (the lowest layers) -->
            <div class="piece backing" id="paperCream" aria-hidden="true"><img class="cutA" src="images/textures/paper.jpg" alt="" /></div>
            <div class="piece backing" id="paperKraft" aria-hidden="true"><img class="cutE" src="images/textures/kraft.jpg" alt="" /></div>

            <!-- TEXTURE SCRAPS: one for each environment -->
            <div class="piece" id="kelpScrap" aria-hidden="true"><img class="cutB" src="images/textures/kelp.jpg" alt="" /></div>
            <div class="piece" id="sandScrap" aria-hidden="true"><img class="cutE" src="images/textures/sand.jpg" alt="" /></div>
            <div class="piece" id="iceScrap" aria-hidden="true"><img class="cutC" src="images/textures/ice.jpg" alt="" /></div>
            <div class="piece" id="barkScrap" aria-hidden="true"><img class="cutF" src="images/textures/bark.jpg" alt="" /></div>

            <!-- CREATURES: all eleven, each one once -->
            <div class="piece" id="ravinak"><img class="cutE" src="images/creatures/ravinak.jpg" alt="Ravinak (Star Trek): an armoured ice predator surfacing from shadow" /></div>
            <div class="piece" id="sando"><img src="images/creatures/sando-aqua-monster.png" alt="Sando aqua monster (Star Wars): a vast whale-like swamp creature, drawn as a field-guide plate" /></div>
            <div class="piece" id="watcher"><img class="cutG" src="images/gifs/watcher-writhe.gif" alt="The Watcher in the Water (Tolkien): a mass of tentacles rising from a dark lake, rippling" /></div>
            <div class="piece" id="tauntaun"><img class="cutF" src="images/creatures/tauntaun.jpg" alt="Tauntaun (Star Wars): a frosted snow-lizard carrying a rider" /></div>

            <!-- DOOR TO DESERT -->
            <a class="piece door" id="kraytDoor" href="desert.html" target="_self"><img class="cutD" src="images/creatures/krayt-dragon.jpg" alt="Krayt dragon (Star Wars): a colossal sand dragon rearing over tiny robed figures" /></a>

            <!-- DOOR TO WATER -->
            <a class="piece door" id="reaperDoor" href="water.html" target="_self"><img class="cutA" src="images/creatures/reaper-leviathan.jpg" alt="Reaper Leviathan (Subnautica): a pale-eyed deep-sea predator with long grasping arms" /></a>

            <div class="piece" id="typeMa" aria-hidden="true"><span class="scrap">Ma</span></div>
            <div class="piece" id="ungoliant"><img class="cutH" src="images/creatures/ungoliant.jpg" alt="Ungoliant (Tolkien): a giant spider beneath the Two Trees" /></div>
            <div class="piece" id="typeZe" aria-hidden="true"><span class="scrap scrapCream">ze</span></div>
            <div class="piece" id="wampa"><img class="cutB" src="images/creatures/wampa.jpg" alt="Wampa (Star Wars): a white snow-beast in an ice cave" /></div>
            <div class="piece" id="leMatyaPiece"><img src="images/creatures/le-matya.png" alt="Le-matya (Star Trek): a green and yellow desert predator, drawn in pencil crayon" /></div>
            <div class="piece" id="ent"><img src="images/creatures/ent-treebeard-card.png" alt="Treebeard, an Ent (Tolkien), shown on a trading card" /></div>
            <div class="piece" id="typeG" aria-hidden="true"><span class="scrap scrapCream">g.</span></div>
            <div class="piece" id="raptor"><img src="images/creatures/velociraptor.png" alt="Velociraptor: a feathered pack-hunter with a blue crest" /></div>

            <!-- CUT-UP TYPE: lettering as a texture (Im / g. / Ma / ze), on top of everything -->
            <div class="piece" id="typeIm" aria-hidden="true"><span class="scrap">Im</span></div>

        </main>
        <div id="grain"></div>
    </body>
</html>
