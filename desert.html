<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Img.Maze - desert</title>
        <link href="stylesheets/mystyles.css" rel="stylesheet" type="text/css"/>
        <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    </head>

    <!-- DESERT PAGE: absolute + scale.
         One vast image (the Krayt dragon, far wider than the window) and a few very small things.
         The sun is a button: click it and the desert goes to night (click again for day). The patch of sand does the same.
         Hover the tiny Le-matya and it swells. Hover the still in the top left and it plays.
         Three textures are links: the ice and the bark (TEMP, see below) and the hatched paper (an outside encyclopedia). -->
    <body id="desert">

        <!-- the hidden day / night switch. It must come BEFORE everything it changes (see "THE LIGHT SWITCH" in mystyles.css) -->
        <input type="checkbox" id="night" aria-label="Day or night" />
        <div id="sky"></div>
        <div id="skyNight"></div>

        <main id="dunes">
            <div id="sand"><div id="sandTexture"></div></div>
            <i id="sunB"></i>

            <!-- ANCHOR / ABSOLUTE -->
            <div id="colossus">
                <img id="krayt" src="images/creatures/krayt-dragon.jpg" alt="Krayt dragon (Star Wars): a colossal sand dragon rearing over tiny robed figures" />

                <!-- TEMP: the ice patch will go to frozen.html once that page is built -->
                <a class="tex" id="iceTex" href="index.html" target="_self"><img src="images/textures/ice.jpg" alt="A patch of ice" /></a>

                <!-- TEMP: the bark patch will go to forest.html once that page is built -->
                <a class="tex" id="barkTex" href="water.html" target="_self"><img src="images/textures/bark.jpg" alt="A patch of bark" /></a>

                <!-- hatched paper: a link to an outside encyclopedia -->
                <a class="tex" id="pageTex" href="https://en.wikipedia.org/wiki/Sandworm_(Dune)" target="_blank" rel="noopener" aria-label="Encyclopedia: Sandworm, from Dune (opens in a new tab)"><span class="engraving"></span></a>

                <!-- the spare texture: a second light switch -->
                <label class="tex" id="sandTex" for="night"><img src="images/textures/sand.jpg" alt="A patch of sand that changes the light" /></label>
            </div>

            <!-- top left: a still of the dragon's mouth. Hover it and the GIF underneath comes alive. -->
            <div id="watch">
                <img id="eyeStill" src="images/gifs/krayt-eye.jpg" alt="Close-up of the Krayt dragon's mouth and teeth" />
                <img id="eyeGif" src="images/gifs/krayt-shimmer.gif" alt="" />
            </div>

            <!-- STICKY: the sun stays in the sky while the sand scrolls. It is a label for the hidden checkbox. -->
            <div id="rail">
                <label id="sun" for="night" aria-label="The sun: click to change the light"></label>
            </div>

            <!-- RELATIVE: tiny next to the dragon. Hover it and it swells. -->
            <img id="leMatya" src="images/creatures/le-matya.png" alt="Le-matya (Star Trek): a green and yellow desert predator, drawn in pencil crayon, tiny beside the dragon" />
        </main>

        <div id="grain"></div>
    </body>
</html>
