<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Img.Maze — forest</title>
  <meta name="description" content="Img.Maze — the forest biome. In-progress prototype.">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>

<!-- FOREST · z-index depth + relative
     Six rigid paper planes stacked with z-index. Scrolling "peels" them: the nearer the plane, the faster it grows,
     so you walk forward through the trees. Creatures sit between planes and peek out, or sit in front of a plane and break it.
     Interactions: scroll to peel · hover a creature and it leans out further · after the peel the Ent (external)
     and two doors (Water, back to the start) appear in the clearing. -->
<body class="page-forest" data-page="forest">
  <main class="forest" id="forest">
    <div class="forest__stage">
      <div class="frame">

        <div class="plane plane--sky" aria-hidden="true"></div>

        <!-- z1 · BACK: far trunks, plus everything the peel reveals -->
        <div class="plane plane--back">
          <img class="art" src="img/foliage/back.png" alt="">
          <a class="f-anchor reveal out" href="https://en.wikipedia.org/wiki/Ent" target="_blank" rel="noopener noreferrer"
             aria-label="Encyclopedia: Ent (opens in a new tab)">
            <img src="img/creatures/ent.png" alt="Treebeard, an Ent (Tolkien), shown on a trading card">
          </a>
          <a class="f-door f-door--water reveal door" href="water.html" data-door aria-label="Water">
            <img class="cut-5" src="img/creatures/reaper.jpg" alt="Reaper Leviathan (Subnautica): a pale-eyed deep-sea predator, far from its water">
          </a>
          <a class="f-door f-door--landing reveal door" href="index.html" data-door aria-label="Back to the start">
            <span class="scrap"><b>M</b></span>
          </a>
        </div>

        <!-- z2 · BETWEEN: a creature behind the mid plane, only its head looks out (relative-positioned) -->
        <div class="plane plane--between">
          <img class="peek peek--raptor" src="img/creatures/raptor.png" alt="Velociraptor: a feathered pack-hunter with a blue crest, peering from behind a tree">
        </div>

        <!-- z3 · MID: the rigid trunks -->
        <div class="plane plane--mid" aria-hidden="true">
          <img class="art" src="img/foliage/mid.png" alt="">
        </div>

        <!-- z4 · BREAK: a creature in front of the mid plane, breaking it -->
        <div class="plane plane--break">
          <img class="peek peek--ungoliant cut-7" src="img/creatures/ungoliant.jpg" alt="Ungoliant (Tolkien): a giant spider beneath the Two Trees, stepping through the trees">
        </div>

        <!-- z5 · floor -->
        <div class="plane plane--ground" aria-hidden="true">
          <img class="art" src="img/foliage/undergrowth.png" alt="">
        </div>

        <!-- z6 · FRONT: the foliage curtains that peel apart -->
        <div class="plane plane--front" aria-hidden="true">
          <img class="curtain curtain--left"  src="img/foliage/front-left.png"  alt="">
          <img class="curtain curtain--right" src="img/foliage/front-right.png" alt="">
        </div>

      </div>
    </div>
  </main>
</body>
</html>
