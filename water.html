<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Img.Maze - water</title>
        <link href="stylesheets/mystyles.css" rel="stylesheet" type="text/css"/>
        <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    </head>

    <!-- WATER PAGE: fixed + sticky.
         The light and the hidden creature are position:fixed, so they never move. The page behind them scrolls and gets darker.
         The biggest creature is hidden: only murk and ripples give it away. Point at the corrupted patch and it surfaces; click it and it lunges.
         Links: the kelp (outside wiki), the sticky Wampa (a snow creature lost in the sea, to Forest) and the GIF at the very bottom (to Desert). -->
    <body id="water">

        <!-- the hidden switch for the glitch patch. It must come BEFORE the reef it changes (see "THE SUMMONING" in mystyles.css) -->
        <input type="checkbox" class="switch" id="summon" aria-label="Wake the Reaper" />

        <!-- FIXED LAYERS -->
        <div id="lightWebs"></div>
        <div id="snow"></div>

        <div id="reef">
            <div id="lair">
                <!-- #lens comes BEFORE #anchorBox: that order is what lets the CSS reveal the anchor (see "REVEAL" in mystyles.css) -->
                <label id="lens" for="summon"><img src="images/creatures/reaper-glitch.jpg" alt="A patch of corrupted signal" /></label>
                <div id="anchorBox" class="cutA"><img id="anchor" src="images/creatures/reaper-leviathan.jpg" alt="Reaper Leviathan (Subnautica): a pale-eyed deep-sea predator with long grasping arms" /></div>
                <div id="ripples"></div>
            </div>

            <!-- top-right patch of kelp: a link to an outside wiki -->
            <a id="wiki" href="https://subnautica.fandom.com/wiki/Reaper_Leviathan" target="_blank" rel="noopener"><img src="images/textures/kelp.jpg" alt="Kelp: a link to the Subnautica wiki page for the Reaper Leviathan (opens in a new tab)" /></a>
        </div>

        <!-- THE DIVE: a long page that scrolls over the fixed layers -->
        <main>
            <div id="surface"></div>

            <!-- STICKY: the Wampa stays put while you scroll. It is a link to the forest. -->
            <a id="stickyWampa" href="forest.html" target="_self"><img class="cutB" src="images/creatures/wampa.jpg" alt="Wampa (Star Wars): a white snow-beast in an ice cave, a long way from the cold" /></a>

            <!-- creatures that slide past as you scroll -->
            <img id="watcherWater" class="cutG" src="images/creatures/watcher-in-the-water.jpg" alt="The Watcher in the Water (Tolkien): a mass of tentacles rising from a dark lake" />
            <img id="sandoWater" src="images/creatures/sando-aqua-monster.png" alt="Sando aqua monster (Star Wars): a vast whale-like swamp creature, drawn as a field-guide plate" />

            <!-- the GIF at the very bottom is a door to Desert -->
            <a id="swimMatya" href="desert.html" target="_self"><img src="images/gifs/le-matya-swim.gif" alt="Le-matya (Star Trek), a desert predator, wading through dark water" /></a>
        </main>

        <div id="grain"></div>
    </body>
</html>
